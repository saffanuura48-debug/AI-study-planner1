<!DOCTYPE html>
<html>

<head>

<title>Analytics</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

body{
background:#f5f5f5;
font-family:Arial;
}

.analytics-box{
width:90%;
margin:auto;
margin-top:40px;
}

.top{
background:#800020;
color:white;
padding:20px;
border-radius:12px;
margin-bottom:30px;
text-align:center;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.card{
background:white;
padding:30px;
border-radius:15px;
flex:1;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.card h1{
color:#800020;
font-size:45px;
}

.btn{
display:inline-block;
margin-top:30px;
background:#800020;
color:white;
padding:12px 25px;
border-radius:8px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="analytics-box">

<div class="top">

<h1>Analytics Dashboard 📊</h1>

<p>
Monitor system statistics and student progress
</p>

</div>

<div class="cards">

<div class="card">

<h1>{{ total_users }}</h1>

<p>Total Users</p>

</div>

<div class="card">

<h1>{{ total_subjects }}</h1>

<p>Total Subjects</p>

</div>

</div>

<a href="/admin_dashboard" class="btn">
Back To Dashboard
</a>

</div>

</body>
</html>
