<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="burgundy-bg">

<div class="login-container">

<div class="login-box">

<h1>Admin Login 👑</h1>

<p class="subtitle">

Secure admin access only

</p>

<form method="POST">

<input
type="email"
name="email"
placeholder="Admin Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login as Admin

</button>

</form>

<p class="bottom-text">

Back to

<a href="/">

Home

</a>

</p>

</div>

</div>

</body>
</html>
