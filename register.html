<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="burgundy-bg">

<div class="login-container">

    <div class="login-box">

        <h1>Create Account 📝</h1>

        <p class="subtitle">

            Join AI Study Planner today

        </p>

        <form method="POST">

            <input
            type="text"
            name="name"
            placeholder="Full Name"
            required>

            <input
            type="email"
            name="email"
            placeholder="Email"
            required>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

            <button type="submit">

                Register

            </button>

        </form>

        <p class="bottom-text">

            Already have account?

            <a href="/login">

                Login

            </a>

        </p>

    </div>

</div>

</body>
</html>
