<!DOCTYPE html>
<html>

<head>

<title>Notes</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="sidebar">

<h2>AI Planner 🤖</h2>

<a href="/dashboard">Dashboard</a>
<a href="/notes">Notes</a>
<a href="/notifications">Notifications</a>
<a href="/timer">Study Timer</a>
<a href="/profile">Profile</a>
<a href="/settings">Settings</a>
<a href="/logout">Logout</a>

</div>

<div class="main-content">

<div class="topbar">

<h1>Study Notes 📝</h1>

</div>

<div class="card">

<form method="POST">

<textarea
name="note"

style="
width:100%;
height:300px;
padding:20px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
">{{ saved_note }}</textarea>

<br><br>

<button type="submit">

Save Notes

</button>

</form>

</div>

</div>

</body>
</html>
