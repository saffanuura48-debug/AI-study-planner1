<!DOCTYPE html>
<html>

<head>

<title>Manage Users</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

body{
background:#f5f5f5;
font-family:Arial;
}

.container{
width:90%;
margin:auto;
margin-top:40px;
}

.top{
background:#800020;
color:white;
padding:20px;
border-radius:12px;
margin-bottom:30px;
text-align:center;
}

table{
width:100%;
background:white;
border-collapse:collapse;
border-radius:10px;
overflow:hidden;
}

table th{
background:#800020;
color:white;
padding:15px;
}

table td{
padding:15px;
border-bottom:1px solid #ddd;
text-align:center;
}

.delete{
background:red;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:6px;
}

.btn{
display:inline-block;
margin-top:30px;
background:#800020;
color:white;
padding:12px 25px;
border-radius:8px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="top">

<h1>Manage Users 👥</h1>

</div>

<table>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Action</th>

</tr>

{% for user in users %}

<tr>

<td>{{ user[0] }}</td>
<td>{{ user[1] }}</td>
<td>{{ user[2] }}</td>
<td>{{ user[4] }}</td>

<td>

<a href="/delete_user/{{ user[0] }}"
class="delete">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

<a href="/admin_dashboard" class="btn">
Back To Dashboard
</a>

</div>

</body>
</html>
